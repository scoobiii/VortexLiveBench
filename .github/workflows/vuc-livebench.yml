name: VortexLiveBench S0 Reality & Supply-Chain Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Deterministic npm Lockfile
        run: |
          set -euo pipefail
          test -f package-lock.json || test -f npm-shrinkwrap.json || {
            echo "::error::A committed npm lockfile is mandatory. Refusing dependency resolution without a lockfile."
            exit 1
          }

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Verify Node/npm Contract
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e 'const p=require("./package.json"); if (!p.engines?.node || !p.engines.node.includes("22")) { throw new Error("package.json must declare the Node 22 contract"); }'

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Published Package Contents
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee /tmp/npm-pack.txt
          grep -F "README.md" /tmp/npm-pack.txt
          grep -F "bin/vortex-livebench.js" /tmp/npm-pack.txt
          grep -F "vuc_harness.py" /tmp/npm-pack.txt

      - name: S0 Reality Gate - Reject Synthetic Benchmark Execution
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='S0_REALITY_BASELINE.md'             'VOCAB_MAP|10000 \+ .*hash\(|TENSOR_.*model|peak_ram_mb.*size_mb.*\+ 120|VERIFIABLE.*STATE.*TRANSITION|runtime: python.*vuc_harness|VERIFIED_VALID'             .; then
            echo "::error::Synthetic/mock execution constructs are present in the benchmark repository path. They cannot be accepted as real benchmark evidence."
            exit 1
          fi

      - name: S0 Reality Gate - Legacy Harness Must Not Emit Evidence
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git             'vuc_harness\.py|Run VortexLiveBench.*Merkle|vuc-attestations-'             .github/workflows; then
            echo "::error::CI must not execute or publish the legacy synthetic harness as benchmark evidence."
            exit 1
          fi
